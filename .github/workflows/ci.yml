name: CI

# Rule verification gate: license headers, formatting, strict static analysis,
# and the full test suite must all pass on every push / PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned to the last validated stable hotfix. pubspec floors
          # flutter: ">=3.47.0"; an unpinned stable can flip format/analyze
          # red with zero code change. Bump this with a same-line hotfix
          # eval — do not casually flutter upgrade a shared host SDK.
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: License headers (MIT SPDX on every .dart)
        run: bash tool/check_license_headers.sh

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis (strict — see analysis_options.yaml)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests
        run: flutter test

      - name: Bundled font license
        run: |
          flutter build bundle --debug --no-pub
          python3 - <<'PYTHON'
          import gzip
          from pathlib import Path

          expected = Path('assets/fonts/OFL.txt').read_text().strip()
          with gzip.open('build/flutter_assets/NOTICES.Z', 'rt') as notices:
              assert expected in notices.read(), 'Klee One license missing from app bundle'
          PYTHON
